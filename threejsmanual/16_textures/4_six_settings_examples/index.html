<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Textures - Six Settings Examples</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      #diagram {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #c {
        width: 100%;
        height: 100%;
        display: block;
      }
      .hint-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        pointer-events: none;
      }
      .hint {
        background: rgba(255,0,0,.8);
        color: white;
        padding: .5em;
        margin: 1em;
        font-family: sans-serif;
        font-size: small;
        border-radius: .5em;
        line-height: 1.2;
        user-select: none;
      }
      .filter-caption {
        position: absolute;
        color: white;
        line-height: 1.1;
        font-family: monospace;
        font-size: small;
        text-shadow:
          -1px -1px 0 #000,
           1px -1px 0 #000,
          -1px  1px 0 #000,
           1px  1px 0 #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="diagram">
      <canvas id="c"></canvas>
      <div class="hint-container">
        <div class="hint">click to<br>change<br>texture</div>
      </div>
      <div class="filter-caption" style="left: 0.5em; top: 0.5em;">nearest</div>
      <div class="filter-caption" style="width: 100%; text-align: center; top: 0.5em;">linear</div>
      <div class="filter-caption" style="right: 0.5em; text-align: right; top: 0.5em;">nearest<br>mipmap<br>nearest</div>
      <div class="filter-caption" style="left: 0.5em; text-align: left; bottom: 0.5em;">nearest<br>mipmap<br>linear</div>
      <div class="filter-caption" style="width: 100%; text-align: center; bottom: 0.5em;">linear<br>mipmap<br>nearest</div>
      <div class="filter-caption" style="right: 0.5em; text-align: right; bottom: 0.5em;">linear<br>mipmap<br>linear</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
