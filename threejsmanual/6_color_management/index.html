<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color management</title>
    <style>
      body { margin: 0; }
      #labels {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        pointer-events: none;
      }
      #labels div {
        flex: 1;
        padding: 12px;
        color: #fff;
        font: 14px/1.4 sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="labels">
      <div>Correct<br>sRGB input → Linear-sRGB working → sRGB output</div>
      <div>Missing output conversion<br>output is Linear-sRGB: too dark</div>
      <div>Both wrong<br>no input or output conversion: harsh shading</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
