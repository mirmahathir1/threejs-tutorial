<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Materials - MeshStandardMaterial</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        background: white;
        font-family: monospace;
      }
      #c {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #content {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .spread {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .spread > div {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .view {
        flex: 1;
        min-height: 0;
      }
      .label, .caption {
        text-align: center;
        padding: .5em;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="content">
      <div class="spread">
        <div>
          <div class="view" id="standard"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
